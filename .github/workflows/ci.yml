name: ci
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: analyzer/requirements.txt
      - name: ffmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg libsndfile1
      - run: npm ci
      - run: python -m pip install -r analyzer/requirements.txt
      - name: Sintaks modul frontend
        run: npm run check:ui
      - name: Tes Node (termasuk satu uji dengan analyzer nyata)
        run: npm test
        env:
          SESSION_SECRET: ci-secret-0123456789abcdef
      - name: Data evaluasi publik (sha256 diverifikasi; tanpa ini 10 tes Python dilewati)
        run: python analyzer/evaluation/fetch_data.py
      - name: Keutuhan model (sha256 terhadap analyzer/models/MODELS.json)
        run: python -I analyzer/verify_models.py
      - name: Tes Python
        run: npm run test:py
  e2e:
    runs-on: ubuntu-24.04
    needs: test
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg libsndfile1
      - run: npm ci
      - run: python -m pip install -r analyzer/requirements-dev.txt
      - run: python -m playwright install --with-deps chromium
      - name: Uji ujung-ke-ujung (alur maestro, alur pelajar, 72 pemeriksaan halaman termasuk axe-core)
        run: python e2e/run_all.py
        env:
          SESSION_SECRET: ci-secret-0123456789abcdef
  docker:
    runs-on: ubuntu-24.04
    needs: test
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Build image (verifikasi Dockerfile)
        run: docker build -t se-laras:ci .
      - name: "Asap uji: server hidup dan sehat"
        run: |
          docker run -d --name laras -p 3000:3000 -e SESSION_SECRET=ci-secret-0123456789abcdef se-laras:ci
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:3000/healthz && exit 0; sleep 2; done
          docker logs laras; exit 1
